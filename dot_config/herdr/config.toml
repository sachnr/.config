onboarding = false

[terminal]
default_shell = "fish"

[ui]
sidebar_width = 32
right_click_passthrough_modifier = "ctrl"

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = true

[keys]
prefix = "ctrl+b"
workspace_picker = "prefix+w"
new_workspace = ["prefix+shift+n", "ctrl+alt+n"]
toggle_sidebar = "prefix+b"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "ctrl+alt+p"
type = "popup"
command = "bash $HOME/.config/herdr/herdr-project-picker"
description = "open project picker"
width = "90%"
height = "90%"

[experimental]
kitty_graphics = true
pane_history = true

[advanced]
# Maximum scrollback bytes retained per pane terminal. `scrollback_lines` is
# accepted as a legacy alias.
# Default: 10000000.
scrollback_limit_bytes = 52428800

[session]
# resume_agents_on_restore = true

[theme.custom]
accent = "#e8a87c"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#45394c"
selection_bg = "#4f4157"
surface0 = "#45394c"
surface1 = "#4f4157"
surface_dim = "#141118"
overlay0 = "#74626a"
overlay1 = "#c8b8a8"
text = "#f5ede6"
subtext0 = "#c8b8a8"
mauve = "#c89ab8"
green = "#7aad5a"
yellow = "#e8c87a"
red = "#d96b6b"
blue = "#8a9ab8"
teal = "#8ac8c0"
peach = "#d9a26b"
